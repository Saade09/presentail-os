kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = ["bash", "scripts/deploy-build-api-server.sh"]
run = ["node", "artifacts/api-server/production-entry.cjs"]

[services.production.env]
PORT = "8080"
NODE_ENV = "production"
PLAYWRIGHT_BROWSERS_PATH = "/home/runner/workspace/.cache/ms-playwright"

[services.production.health.startup]
path = "/api/healthz"

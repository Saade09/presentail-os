appId: com.presentail.osmobile
---
# ── Step 0: launch app ────────────────────────────────────────────────────────
- launchApp:
    clearState: true

- assertVisible:
    id: "welcome-headline"

# ── Step 1: navigate to sign-in ───────────────────────────────────────────────
- tapOn: "Sign in"

- assertVisible: "Welcome back"
- assertVisible:
    id: "email-input"
- assertVisible:
    id: "password-input"

# ── Step 2: navigate to forgot-password ───────────────────────────────────────
- tapOn: "Forgot password?"

- assertVisible:
    id: "forgot-password-title"

- assertVisible: "Forgot password?"
- assertVisible: "Email address"
- assertVisible: "Send reset code"
- assertVisible:
    id: "forgot-email-input"

# "Send reset code" button is disabled while the email field is empty
- assertNotVisible:
    id: "forgot-error-message"

# ── Step 3: fill in the email field ───────────────────────────────────────────
- tapOn:
    id: "forgot-email-input"

- inputText: "test@example.com"

# Button is now enabled — verify it is still present after input
- assertVisible: "Send reset code"

# ── Step 4: submit the request ────────────────────────────────────────────────
# Tapping the button with a non-existent Clerk account exercises the API error
# path: the screen stays on the request step and shows an error message.
- tapOn: "Send reset code"

# The screen should remain on step 1 (title still visible) and show an error
- assertVisible:
    id: "forgot-password-title"

- assertVisible:
    id: "forgot-error-message"

# ── Step 5: navigate back to sign-in via the back button ──────────────────────
- tapOn: "← Back"

- assertVisible: "Welcome back"
- assertVisible:
    id: "email-input"

# ── Step 6: re-enter forgot-password and confirm step-1 UI is stable ──────────
# NOTE: Step 2 (code-entry + new-password) is NOT exercised by executable
# assertions below.  Reaching step 2 requires the Clerk API to accept a real
# account email and return a 200, which cannot be mocked in Maestro.
#
# The step-2 testIDs added to forgot-password.tsx are listed here for
# reference — they are the target of follow-up task #1447, which will add
# a credentials-gated flow once a Clerk test account is provisioned:
#
#   id: "check-email-title"     → "Check your email" heading
#   id: "reset-code-input"      → reset code TextInput
#   id: "new-password-input"    → new-password TextInput
#   text: "Set new password"    → submit button label
#   text: "Resend code"         → resend link
- tapOn: "Forgot password?"

- assertVisible:
    id: "forgot-password-title"

- assertVisible: "Send reset code"
- assertVisible:
    id: "forgot-email-input"

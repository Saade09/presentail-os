kind = "web"
previewPath = "/"
title = "Presentail OS"
version = "1.0.0"
id = "artifacts/print-agent-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19540

[services.development]
run = "pnpm --filter @workspace/print-agent-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/print-agent-web", "run", "build" ]
publicDir = "artifacts/print-agent-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19540"
BASE_PATH = "/"
